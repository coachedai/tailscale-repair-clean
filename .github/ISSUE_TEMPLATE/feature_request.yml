name: Feature request
description: Suggest a product improvement without sharing private machine or network data.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem or workflow you want improved.
        Do not attach screenshots, raw logs, IP addresses, device names, account details, configuration files, tokens, keys or credentials.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Keep the example generic and remove private names, addresses and identifiers.
      placeholder: Explain the user problem rather than private machine details.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Quick Repair to do?
      description: Describe the behaviour or interface you would find useful.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Local Tailscale health
        - Connection checks
        - Automatic Repair
        - VPN coexistence
        - Diagnostics
        - Updates and installation
        - Interface and tray
        - Privacy and support reports
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included screenshots, raw logs, IP addresses, device names, account details, configuration files, tokens, keys or credentials.
          required: true
        - label: I understand that a public issue can be read and copied by anyone.
          required: true
